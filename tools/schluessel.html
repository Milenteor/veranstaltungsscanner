<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schlüssel erzeugen</title>
<style>
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:32px auto;padding:0 16px;color:#141413;background:#faf9f5}
h1{font-size:24px}label{display:block;font-weight:600;margin:18px 0 4px}
textarea{width:100%;box-sizing:border-box;font:14px ui-monospace,Menlo,monospace;padding:10px;border:1.5px solid #c9c7bd;border-radius:8px;height:64px}
button{font:inherit;font-weight:600;padding:10px 16px;border:0;border-radius:10px;background:#CB1967;color:#fff;cursor:pointer}
.note{background:#fff8cc;border-left:5px solid #F6D000;padding:10px 14px;border-radius:0 8px 8px 0}
</style></head><body>
<h1>Schlüssel für den Veranstaltungsscanner</h1>
<p class="note">Diese Seite läuft nur in deinem Browser und schickt nichts ins Netz. Einmal öffnen, die drei Werte an die in SETUP.md genannten Stellen kopieren, dann Seite schließen. Nicht neu laden, bevor alles kopiert ist: jedes Laden erzeugt neue Schlüssel.</p>
<button id="go">Schlüssel erzeugen</button>
<label for="pub">VAPID öffentlicher Schlüssel → in web/config.js bei vapidPublicKey</label><textarea id="pub" readonly></textarea>
<label for="priv">VAPID privater Schlüssel → GitHub-Geheimnis VAPID_PRIVATE_KEY (niemals in eine Datei)</label><textarea id="priv" readonly></textarea>
<label for="cron">Zufallswert → GitHub-Geheimnis CRON_SECRET</label><textarea id="cron" readonly></textarea>
<script>
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
document.getElementById('go').onclick = async () => {
  const k = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  document.getElementById('pub').value = b64u(await crypto.subtle.exportKey('raw', k.publicKey));
  document.getElementById('priv').value = (await crypto.subtle.exportKey('jwk', k.privateKey)).d;
  document.getElementById('cron').value = b64u(crypto.getRandomValues(new Uint8Array(24)));
};
</script>
</body></html>
