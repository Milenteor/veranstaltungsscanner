name: Edge Functions einrichten

# Einmal nach dem Einrichten von Hand starten und nach jeder Änderung an supabase/functions automatisch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/functions.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: wnitsbvsdrxflbfxurtz
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Geheimnisse für die Funktionen setzen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN_FOR_SCAN: ${{ secrets.GH_DISPATCH_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_ORIGIN: https://milenteor.github.io
        run: |
          supabase secrets set --project-ref "$REF" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            GH_TOKEN="$GH_TOKEN_FOR_SCAN" \
            GH_REPO="${{ github.repository }}" \
            CRON_SECRET="$CRON_SECRET" \
            APP_ORIGIN="${APP_ORIGIN:-*}"
      - name: Funktionen hochladen
        run: |
          for f in ask scan-now fetch-link ics; do
            supabase functions deploy "$f" --project-ref "$REF" --no-verify-jwt
          done
